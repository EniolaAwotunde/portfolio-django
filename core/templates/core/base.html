{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eniola Awotunde{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <a href="{% url 'home' %}" class="brand">
                    <span class="brand-name">Eniola Awotunde</span>
                    <span class="brand-title">Software Engineer</span>
                </a>

                <nav class="main-nav">
    <a href="/#home" class="nav-link">Home</a>
    <a href="/#work" class="nav-link">Work</a>
    <a href="/#journey" class="nav-link">Journey</a>
    <a href="/#capabilities" class="nav-link">Capabilities</a>
    <a href="/#contact" class="nav-link">Contact</a>
</nav>
            </div>

            <div class="sidebar-bottom">
                <div class="social-links">
                    <a href="https://github.com/EniolaAwotunde" target="_blank" aria-label="GitHub">GH</a>
                    <a href="https://linkedin.com/in/eniola-awotunde-867a29244" target="_blank" aria-label="LinkedIn">IN</a>
                    <a href="mailto:Awotundeeniola696@gmail.com" aria-label="Email">@</a>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    <span class="toggle-label">Light</span>
                </button>
            </div>
        </aside>

        <button class="mobile-nav-toggle" id="navToggle" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>

        <div class="mobile-drawer" id="mobileDrawer">
    <a href="/#home" class="drawer-link">Home</a>
    <a href="/#work" class="drawer-link">Work</a>
    <a href="/#journey" class="drawer-link">Journey</a>
    <a href="/#capabilities" class="drawer-link">Capabilities</a>
    <a href="/#contact" class="drawer-link">Contact</a>
</div>

        <main class="page-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
